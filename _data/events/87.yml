  - type: talk
    title: |
      Stop Burning Tokens: Feedback Loops for AI Agents in Kubernetes
    abstract: >
      AI coding agents are great at generating code, but terrible at knowing
      whether that code actually works. At MetalBear we ran into this with
      agents doing frontend work, and solved it with a fast feedback loop
      that tells the agent "that worked" or "that broke" in seconds — by
      running E2E tests against real Kubernetes services via mirrord, so
      the agent can self-correct without deploying after every change.
