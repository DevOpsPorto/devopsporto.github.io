title: The Sound of DevOps
agenda:
  - type: intro
  - type: talk
    title: Continuous Delivery Patterns for Boring Releases
    abstract: >
      In today's world, we need not only to maintain our systems running 24x7 in production but we
      must also be able to keep them releasable 24x7. We can only do that with modern infrastructure
      and software delivery practices. Releases should be even more boring and risk-free than washing
      up clothes at the laundromat. Make a code change, see it go through the pipeline, get green or
      red result. If red, fix or rollback. If green, deploy. If deploy fails, rollback. Monitor
      forever.


      Because everyone wants to go faster but also safer, we're cramming more and more activities in
      the pipeline, from security controls to database changes, to compliance approvals, soon
      networking... How can we do this AND still move fast AND avoid burning out teams with all this
      cognitive load? Oh, and break down silos in the process, of course (DevOps bingo!).


      In this talk you'll learn how to ensure that your delivery system serves its core purpose of
      quickly and safely progressing our client-facing systems from commit to production. You'll also
      hear about key practices for software releasability like pipeline-as-code, short and wide
      pipelines, build and release from zero to production, blue-green deployments, and more!
