  - type: talk
    title: |
      Collaboration Hub - Cloud Development Environments
      powering Project Performance
    abstract: >
      The speakers share their experience building cloud-based development
      environments for multi-organizational collaboration in Manufacturing
      systems. They address challenges of managing developers across
      different teams with varying hardware and security constraints,
      presenting a solution using "Devcontainers for version isolation"
      and "VS Code Server for browser-based development." The result
      achieved: "Developer onboarding dropped from 3-5 days to less
      than an hour."
