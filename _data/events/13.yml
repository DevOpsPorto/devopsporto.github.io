        linkedin: giulianoribeiro
        bio: >
          Giuliano Ribeiro is Cloud Solutions Architect at
          <a href="http://ilegra.com/">ilegra</a>, working with Google technologies last 5 years.
          Also worked as software engineer, software architect and DevOps Engineer. After years
          coding, moved to Google ecosystem deploying Google's products and creating high valuable
          integrations on customers to get more on the cloud.
