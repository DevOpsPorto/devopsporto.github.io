title: Google Cloud Platform and Kubernetes
agenda:
  - type: intro
  - type: talk
    title: Introduction on Google Kubernetes Engine (GKE) for CI/CD
    abstract: >
      Kubernetes Engine is a great platform for your containers running on Google Cloud Platform, but
      is possible to do more with it. Continuous Integration and Continuous Delivery are unquestionable
      practices on daily basis for modern products and companies to be up to speed with the market.


      Our invited speaker will show how to get the best of both together.
    speakers:
      - name: Giuliano Ribeiro
        image: m013_giuliano.png
