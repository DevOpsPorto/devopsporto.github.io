title: La Redoute transformation powered by DevOps
agenda:
  - type: intro
  - type: talk
    title: How DevOps supported La Redoute reinvention
    abstract: >
      In 2014, La Redoute had 4 years to reinvent itself to regain its profitability. Structural
      transformation was required to evolve all parts of the business and IT, where DevOps revealed to
      be a major accelerator for the company since then. The company is now focused on scaling teams
      supported by a distributed microservices architecture.


      Our invited speaker, Antoine Craske, will share La Redoute's experience, practices and learnings
      during the transformation journey.
