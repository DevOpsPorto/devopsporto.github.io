  - type: talk
    title: |
      Clear Thinking Under Pressure: Practical Tools for Better Decisions
    abstract: >
      In high-pressure situations—such as incident response, debugging, or critical deployments—decision-making can become slower, narrower, and more error-prone, even for highly skilled professionals.
      This session explores how pressure impacts cognitive performance in real technical contexts and, most importantly, how to counteract it. The focus is on practical, immediately applicable tools that can be used during high-stakes situations, including:
      - Simple pause protocols to reduce reactive decisions,
      - Decision checkpoints to avoid common cognitive traps,
      - Techniques to reduce cognitive load during incidents,
      - Clear rules to improve judgment under pressure.
      Participants will leave with concrete strategies to think more clearly, reduce errors, and make better decisions when it matters most.
