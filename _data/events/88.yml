    title: |
      Spec-Driven AI Development with Kiro
    abstract: >
      What does it take to turn AI into a reliable software developer? This talk explores Spec-Driven AI Development with Kiro, showing how clear, structured specs enable agents to build code incrementally, and produce maintainable results—avoiding the chaos of prompt-based development and bringing AI closer to real engineering practices.
