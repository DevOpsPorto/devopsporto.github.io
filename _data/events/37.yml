        twitter: fcosta_oliveira
        bio: >
          Filipe Oliveira is a Performance Engineer at Redis Labs, working on both the enterprise and
          the open-source products as part of the CTO research group. Before Redis Labs, he worked
          both on a large scale retail company and as Grid and Distributed Computing Researcher
          recurring to advanced computing infrastructures listed in the TOP500 supercomputers list.
    slides: https://speakerdeck.com/devopsporto/devopsporto-meetup-37-why-averages-lie-by-filipe-oliveira
  - type: talk
    title: Application monitoring and metric collection for Scala
    abstract: >
      More often than we would care to admit, we've been stuck looking through endless lines of
      logs, code, documentation, stackoverflow posts, ... trying to find the reason behind the
      mysterious disappearance of some row in our database, or why some service always seems to fail
      for no apparent reason the first Tuesday of each month.


      Unfortunately for us, the answer isn't always obvious and usually requires an analysis of
      multiple services and how they interact with each other. In this case, for instance, maybe a
      monthly report is generated on the first Tuesday of each month which makes way to many requests
      to our service causing our db connection pool to throw random errors and, as a consequence,
      random fails occur when inserting values in our database.


      Funny enough, during the entire time, logs were being produced with the exact error but we just
      weren't able to see them in the middle of all the noise.


      In this talk we'll look into how we can integrate and use Kamon to give us a better view of
      what's going on in our applications and how they interact with each other. We'll look into how
      to measure cpu usage, query times, individual endpoints performance, custom metrics as well as
      how to add distributed tracing to our applications so that we can now how they work and how
      they interact with each other.
    speakers:
