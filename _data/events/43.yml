  - type: talk
    title: Reaching a Production-Ready Kubernetes @ La Redoute
    abstract: >
      Our invited speakers started a quest for acceleration and Kubernetes was one element retained
      to modernize the application deployment. Antoine, Daniel, and Ivan will share why changing the
      provisioning paradigm to a cloud-native, distributed, and largely as code model is complex.
      Reaching a production-ready state was an extensive journey full of learnings and now they want
      to share that learnings with the community.
