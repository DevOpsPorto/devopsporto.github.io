type: bootcamp
date: 2018-06-16
host: devscope
title: Global DevOps Bootcamp 2018 @ DevOps Porto
agenda:
  - type: intro
  - type: talk
    title: Global DevOps Bootcamp 2018 @ DevOps Porto
    abstract: >
      Global DevOps Bootcamp is a global event that will be held on Saturday June 16th and is all
      about DevOps on the Microsoft Stack. Centrally organized by Xpirit and Solidify and offered to
      you by this local partner. During this 1-day event we will join (Microsoft) DevOps communities
      all around the world to talk, learn and play with DevOps concepts. The goals: DevOps in general,
      insights into where we are heading when it comes to DevOps and new technologies, and getting
      people's hands dirty playing with all the good Microsoft DevOps stuff.


      This year's theme will be 'From one release per month to multiple releases a day'. We will kick
      off with an introduction of a well-known authority in the DevOps space, followed by a keynote
      from the local partner about where we are heading with DevOps.


      This time the event is all about DevOps and improving your release cadence. It will help you
      understand the latest DevOps trends and insights in modern technologies that enable you to
      release multiple times per day. It is an amazing combination between getting your hands dirty
      and sharing experience and knowledge around VSTS, Azure, DevOps with other community members.


      Of course you won't be on your own. During the day you will be supported and guided by local
      experts who are active in the Microsoft Community.
  - type: wrapup
