  - type: talk
    title: Turbocharging Azure DevOps with Octopus Deploy
    abstract: >
      Often, organizations and members of the Dev and Ops teams have automated the build & test
      but still need to deploy manually and often out of hours. Azure DevOps and Octopus Deploy go
      together like cheese and crackers and are easily integrated and can be used to deploy to Azure
      IaaS & PaaS and also on-Premise.


      In this session, Derek will take you through how to integrate Azure DevOps and Octopus Deploy
      using the extension. He will then configure an Azure pipeline and lastly pass this through to
      Octopus Deploy which will then deploy to Azure from a single build and test all the way to
      Production.
    speakers:
      - name: Derek Campbell
        image: m035_derekcampbell.jpg
        twitter: DevOpsDerek
        bio: >
          Derek has worked across the world in London, Melbourne, Singapore, and now from home in
          Glasgow, Scotland, for Octopus Deploy as a CI/CD Architect in the Customer Success team.
          He has been automating CI/CD pipelines for about eight years and has helped lead and
          implement CI/CD across multiple companies during his time in DevOps & Automation
          Consultancy.


          Derek works with and helps Octopus Deploy's biggest clients with their CI/CD pipeline and
          helps enable their success with Octopus Deploy.
