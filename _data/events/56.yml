title: How to easily manage TLS certificates with Vault
agenda:
  - type: intro
  - type: talk
    title: How to easily manage TLS certificates with Vault
    abstract: >
      Having valid TLS certificates protects our companies, by ensuring privacy and data security
      for communications over the Internet, so we can deliver trust to our users and customers. But
      it is a burden if we don't have a proper process for rotating certificates. As well as it can
      pose some risks and flaws. So, what if we automate it? In this presentation, we will share a
      proposal on how to easily manage the rotation of TLS certificates across all the Infrastructure
      using Vault.
