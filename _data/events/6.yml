title: Security / Culture
agenda:
  - type: intro
  - type: talk
    title: Security in the wild
    abstract: >
      With 0xOPOSEC (@oposec) community as partner, we are happy and grateful for having Renato
      Rodrigues (@simps0n) as invited speaker. For Renato and for a modern software house, security is
      a top priority. It is a fast-paced working environment focused on continuous delivery and
      integration. Keeping up is an endless and demanding challenge for the security team. Issues
      arise and must be addressed efficiently and in an expedited manner. Besides keeping abreast with
      emerging technology, the team needs to develop strategies that ultimately work within the
      organization.


      Can classic analysis tools be used on a strict time cycle? How can a security team handle the
      demands of a product team? How to ensure that everyone is on the same page and understands
      what's under the hood? In seeking answers to these questions, this talk assembles a set of tips
      and tricks by showing some work and spikes used in a real software house. One hopes to provide a
      potential roadmap for the implementation of secure and improved Software Developing Life Cycles.
    speakers:
      - name: Renato Rodrigues
        image: m006_renato.jpg
        twitter: simps0n
        bio: >
          Renato is Informatics Engineer, with high interest in security issues, working in the
          AppSec world for a while. Curator of an AppSec Ezine and promoter of a security enthusiasts
          group – more than breaking through challenges, it is all about sharing the knowledge.
    slides: https://speakerdeck.com/devopsporto/devopsporto-meetup6-security-in-the-wild-by-renato-rodrigues
  - type: break
  - type: talk
    title: "Culture: a gentle introduction"
    abstract: >
      Nuno's talk will cover the following topics: What is a National Culture? What is an
      Organizational Culture? How to make sense of Culture? The Cultural Iceberg. How to decode
      Culture? Some dimensions and models. Culture or Strategy? A multicultural world or work? Agile
      as Culture? DevOps as Culture? Changing Culture? Really? Why? How? A possible approach.
    speakers:
      - name: Nuno Rafael Gomes
        image: m006_nunogomes.jpg
        twitter: nrgomes
        bio: >
          With almost 20 years' experience playing and learning with different people, teams, and
          business challenges, Nuno currently works as an independent Lean Agile Coach helping People
          to achieve their potential, Teams to perform better and Organizations to be nimble.


          Nuno is also the founder of Agile Connect®, a platform that encourages and supports the
