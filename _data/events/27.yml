title: DataOps
agenda:
  - type: intro
  - type: talk
    title: "DataOps: Creating Data Based Solutions ASAP"
    abstract: >
      Data Analytics it's a field in which we can find people working with very different backgrounds
      and with very different tools, This mixture of tools, roles and backgrounds can make very
      painful the process of generating new data based solutions fast, with a good level of quality
      and with confidence in the work you've made. The purpose of this talk it's to provide an
      introduction to the DataOps methodologies and to show the need of good practices creating data
      based solutions.
    speakers:
      - name: Diego Reiriz Cores
        image: m027_diegoreirizcores.jpg
        linkedin: diegoreico
        twitter: diegoreico
        bio: >
          Diego works at Gradiant as an R&D Engineer focused on Data and AI. He is also an AI Research
          Master Student and Vigobrain AI MeetUp Group CoOrganizer. The kind of work he do goes from
          small clusters management to ML/DL based on data from user interactions on different kind of
          scenarios, so he is involved into each step related to the data based solutions that his
          team creates.
    slides: https://speakerdeck.com/devopsporto/devopsporto-meetup27-performing-analytics-asap-by-diego-reiriz-cores
  - type: break
  - type: talk
    title: "DataOps: S.M.A.C.K.ing the insights from your data"
    abstract: >
      There was a time, not long ago, when Data Science flourished and Big Data was everything. Well,
      no one really knew what it was (just like the teenage sex joke), but you had to have it! Such
      behavior created a series of Anti Patterns for Data Science teams: from the cotton
      candy-powered Data Unicorn to the Second-grade Data Plumber, going through the multi-title Jack
      of all (Data) Trades to the fabulous Trophy Data Scientist. This talk will take you on a journey
      that hopefully leads to (not another buzzworded concept) DataOps. And with such great knowledge,
      comes great... technology! We'll also cover the S.M.A.C.K. Stack, because honestly, you wanna do
      things The Right Way!
    speakers:
      - name: Filipe Coelho
        image: m027_filipecoelho.jpg
        linkedin: dataplumbr
        bio: >
          Filipe Coelho is a Senior Software Engineer specialized in the realm of Big Data. He got his
          PhD in Informatics Engineering at FEUP while doing R&D on Machine Learning at INESC TEC.
          More recently, Filipe focused on establishing Production-grade Big Data platforms at
          companies such as Farfetch, Prozis and now Hostelworld mentoring DataOps teams.
    slides: https://speakerdeck.com/devopsporto/devopsporto-meetup-27-s-dot-m-a-dot-c-k-dot-ing-the-insights-from-your-data-by-filipe-coelho
  - type: wrapup
