title: Immutable infrastructure
agenda:
  - type: intro
  - type: talk
    title: From pets to cattle - an immutable approach to infrastructure
    abstract: >
      Welcome to our 25th meetup about DevOps and its culture, values and practices. This meetup will
      take place at Feedzai.


      Traditional server management and deployment strategies rely on existing servers and
      infrastructure managed by some IT/Operations team which when you scale to a few hundred servers
      leads to inconsistent configurations and high management burden. At Feedzai, an immutable server
      approach is being used to achieve highly consistent environments while giving the development
      teams ownership of the deployment rules.


      Our invited speaker, Tiago Rodrigues, will dive into the details on how new product increments
      get shipped from development to production and also how that helped Feedzai deliver faster,
      reduce operational tasks and maintain international certifications. He'll also talk about the
      technologies that support all of this, such as Ansible, Packer and AWS services.
