title: Containers @ Azure
agenda:
  - type: intro
  - type: talk
    title: Azure Container Services
    abstract: >
      Our invited speaker is Pedro Sousa (@psousa75) and in his talk, he will do a brief overview
      about Azure's current offerings for Container deployment and orchestration. This talk will
      include where and how can you start to explore the environments and build a simple DevTest Lab.
    speakers:
      - name: Pedro Sousa
        image: m003_pedrosousa.jpg
        twitter: psousa75
        linkedin: pmsousa
        bio: >
          Pedro is a long-time IT Systems Engineer who has worked across many practices and
          disciplines in his career, with a primary focus on Microsoft-based Infrastructure solutions
          or Mixed-environments. At this point, he's got 20+ years of experience managing
          Microsoft-based corporate infrastructure, ranging from 50 user shops all the way up to
          1,000+ user organizations.


          Currently, he's a Systems Engineer at DevScope where his work ranges the full Microsoft
          stack, from On-Prem Services up to Azure, and solid exposure and knowledge around almost all
          of the core underlying technologies that support and power the core Microsoft Infrastructure
          stack. Previously he has worked 11 years as an IT Trainer (the last ones as a Microsoft
          Certified Trainer).
    slides: https://speakerdeck.com/devopsporto/devopsporto-meetup3-azure-container-services-by-pedro-sousa
