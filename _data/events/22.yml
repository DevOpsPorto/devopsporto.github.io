title: Build Automation in a DevOps way!
agenda:
  - type: intro
  - type: talk
    title: Build Automation in a DevOps way!
    abstract: >
      Do you still configure your builds manually through a User Interface?


      In the past years, Infrastructure as Code has become a new normal, especially with the advent of
      new technologies like Puppet, Chef or Docker.


      This practice made the Operations teams to adopt common development practices to manage their
      infrastructure. Strangely, the Continuous Integration processes continue to be manually
      configured.


      In this session we will explore the Build as Code concept and we will use Cake
      (http://cakebuild.net), a build automation solution based on C#, to help us.
