title: Operations for Databases – The Agile/DevOps Journey
agenda:
  - type: intro
  - type: talk
    title: Operations for Databases – The Agile/DevOps Journey
    abstract: >
      With agile methodologies adoption, database (and infrastructure) started to represent a
      bottleneck in the development process. To solve this problem concepts like Source Control,
      Continuous Integration and Continuous Delivery should be applied to database development in
      order to narrow the gap between applications and databases development.


      Our invited speaker will present a talk about the combination of the different moments of his
      agile journey through Scrum and Kanban and operations scope at different levels: database and
      application (and even infrastructure).
    speakers:
      - name: Eduardo Piairo
        image: m012_eduardopiairo.png
        twitter: EdPiairo
        linkedin: jesuspiairo
        bio: >
          Eduardo is a deployment pipeline craftsman always ready to learn new ways to implement
          Source Control, Continuous Integration and Continuous Delivery for databases, applications
          and infrastructure. He currently works as an operations engineer @
          <a href="https://www.basecone.com/" target="_blank">Basecone</a>, and is a DevOps
          prosecutor with automation, collaboration and communication as priorities. Also, he works
          as a database administrator with special interest in database changes and data modeling.


          The deployment pipeline is his favorite technical and cultural tool. His mission is to
          relieve the delivery pain, while achieving the balance between business and business
          materialization.
    slides: https://speakerdeck.com/devopsporto/devops-journey-by-eduardo-piairo
