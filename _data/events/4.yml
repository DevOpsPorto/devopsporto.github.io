  - type: talk
    title: From Code to Kubernetes
    abstract: >
      Our invited speakers Miguel Ramos (<a href="https://twitter.com/realKha0S">@realKha0S</a>) and
      Ricardo Castro (<a href="https://twitter.com/mccricardo">@mccricardo</a>) will deliver a talk
