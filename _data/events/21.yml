        bio: >
          Remi Dias is a Computer Networking student and enthusiast. Airsoft player and Gamer at
          weekends. Long time Linux user (btw, not Arch). Dislikes hysterical hype and buzzwords.
          Computer builder with a background in hardware sales and repair. My servers set themselves
          on fire sometimes, but no smoke (not much). Believes that everyone will use IPv6 in his
          lifetime (possibly).
