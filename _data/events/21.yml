title: Say hello to SDN
agenda:
  - type: intro
  - type: talk
    title: Introduction to Software Defined Networking (SDN)
    abstract: >
      Network Engineers are said to be bored about the lack of innovation on the enterprise market. A
      48-Port Gigabit switch has the same functionality and price as five years ago! Ridiculous!


      Some people like change. And those bring new concepts and products to the market. They hope it
      sticks.


      The end goal of this talk is to make our small community talk about SDN and weight the pros and
      the cons by themselves. It better happen before the vendors make it the new market buzzword and
      force your CTO to adopt it.


      All the clouds use it, but do you need it too? Decide for yourself.
    speakers:
      - name: Remi Dias
        image: m021_remidias.jpg
