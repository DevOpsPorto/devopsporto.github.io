  - type: talk
    title: |
      Beyond Automation: How AI is Reshaping DevOps
    abstract: >
      AI is only as good as the context you give it. In this session we'll dive
      into GitHub Copilot customizations (instructions, prompts, agents, skills,
      and hooks) that shape how the agent reasons and acts in your workspace,
      and we'll see them in action. We'll explore spec-driven development and
      community skills like ponytail, caveman mode, and andrej-karpathy-skills.
      Along the way you'll learn how tokens are billed and how to reduce them
      using these skills.
