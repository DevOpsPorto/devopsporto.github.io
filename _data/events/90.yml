title: DevOps, AI & Platform
agenda:
  - type: intro
  - type: talk
    title: |
      Building a Platform, Not a Tool Collection
    abstract: >
      Platform Engineering promises to accelerate development teams through
      self-service, but the journey is challenging. In this session, I'll share
      my experience building an internal platform at my company, where we're in
      the early stages of identifying stakeholder needs to determine what should
      be standardized versus local team decisions. The biggest challenges
      weren't technical—they were stakeholder engagement, feedback collection,
      and shifting from 'providing tools' to 'enabling self-service.'
    speakers:
