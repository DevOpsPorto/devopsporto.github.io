title: "Migration: Lift&Shift with Accenture and Google Cloud"
agenda:
  - type: intro
  - type: talk
    title: "Migration: Lift&Shift with Accenture and Google Cloud"
    abstract: >
      Accenture's SAP HANA CoE maintains demo & training SAP systems for Accenture internal use
      worldwide. Those SAP systems were hosted on an AWS infrastructure, and Accenture wanted to
      migrate them to Google Cloud in order to obtain cost savings and synergies with other SAP
      Google Cloud offerings.


      The full AWS SAP HANA infrastructure successfully migrated to Google Cloud automating 70% of
      the migration activities and applying automated migration tools that increased the speed of the
      migration concluding it in 10 weeks.


      In this presentation we'll be discussing the migration of multiple SAP systems to Google Cloud
      using a Lift & Shift approach and what we learned.
