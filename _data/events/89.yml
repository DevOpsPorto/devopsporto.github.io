title: Software Supply Chain Security
agenda:
  - type: intro
  - type: talk
    title: |
      Securing the Software Supply Chain in a Cloud Native World: From CI/CD Pipelines to SLSA
    abstract: >
      This talk provides a focused overview of modern software supply chain
      security through three interconnected lenses: CI/CD pipeline hardening,
      cloud native-specific risks, and the SLSA framework. It examines how
      attackers target build systems and dependencies, and walks through
      practical defenses including artifact signing with Sigstore and Cosign,
      least-privilege access in GitHub Actions and Tekton, and securing
      containerized workloads. SLSA is introduced as an incremental, adoptable
      blueprint for achieving tamper-proof provenance and verifiable build
      integrity.
