          ecosystems. Prior to Google, Mete worked at Microsoft, Skype, Adobe, EMC, and Nokia
          building apps and services on various web, mobile, and cloud platforms. Originally from
          Cyprus, he currently lives in Greenwich, not too far away from the prime meridian.
