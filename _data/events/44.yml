  - type: talk
    title: Choreography vs Orchestration in serverless microservices
    abstract: >
      Mete Atamel, will share the journey from a single monolith to a set of microservices that are
      small, lightweight, and easy to implement. Microservices enable reusability, make it easier to
      change and scale apps on demand but they also introduce new problems.


      How do microservices interact with each other toward a common goal? How do you figure out what
      went wrong when a business process composed of several microservices fails? Should there be a
      central orchestrator controlling all interactions between services or should each service work
      independently, in a loosely coupled way, and only interact through shared events?


      In this talk, Mete will explore the Choreography vs Orchestration question and demo some of the
      tools that can help.
    speakers:
