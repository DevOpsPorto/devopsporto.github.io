title: Bootstrapping SRE [EN]
youtube: https://youtu.be/BWJG4iXWj-8
agenda:
  - type: intro
  - type: talk
    title: "Bootstrapping SRE: SLIs and SLOs where to begin"
    abstract: >
      The Google SRE practice and books can be intimidating, and it's hard to know where to start.
      I'll share how our team started - and how we coached others in how to understand Service Level
      Indicators, and Service Level Objectives, and how to iteratively build and tune them as you go.
    speakers:
      - name: Deborah Wood
        image: m042_deborahwood.jpg
        linkedin: debbiejw
        twitter: Debs_za
        bio: >
          Deborah is a product manager for Tanzu Labs Platform in Europe, and previously was a
          platform product manager for Pivotal. Together with her team she supported the production
          platform for the Pivotal Tracker application. She currently coaches Platform teams in
          external organisations in using lean product management, and user centered design to drive
          value & investment when running internal platform infrastructure. She advocates for the use
          of Site Reliability Engineering, and supports product teams in providing product feedback &
          driving improvements to the UX of operations.
  - type: qa
  - type: wrapup
