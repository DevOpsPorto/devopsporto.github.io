  - type: talk
    title: DevOps/SRE Anti-patterns panel discussion
    abstract: >
      Anti-patterns are solutions to problems that are, usually, ineffective and carry high risks.
      Although they might appear appropriate and effective, the gains tend to be short-term. Their
      consequences turn out to be more trouble than they're worth.


      Like many practices, DevOps and SRE have their fair share of anti-patterns and it's tempting to
      adopt them. Projects might be under budget and time constraints or there might be there a lack
      of proper skills. When a quick and dirty fix is needed in an emergency, without any malicious
      intent, there is usually an intention to come back and do it properly, but time and priorities
      can interfere.


      In this panel discussion, our panelists will explore anti-patterns when trying to onboard
      DevOps/SRE practices into organizations.
    speakers:
      - name: Cláudio Freitas
        image: m047_claudiofreitas.jpeg
        bio: >
          Cláudio is a Systems Administrator/DevOps/SRE and all those fancy words that people use to
          describe guys that work on Systems. He started working in IT from a young age and has been
          in the game for around 12 years. From Helpdesk to Systems Engineer he has been working as a
          freelancer in the SRE/DevOps/Systems area.
      - name: Luís Parada
        image: m047_luisparada.jpeg
        bio: >
          Luís Parada is Head of Engineering at FARFETCH, currently focused on foundational aspects
